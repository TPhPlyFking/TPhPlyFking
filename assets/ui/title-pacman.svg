<svg xmlns="http://www.w3.org/2000/svg" width="880" height="78" viewBox="0 0 880 78">
<defs>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/>
<animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g transform="translate(26 36)">
<polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#140c33" stroke="#a78bfa" stroke-width="1.5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></polygon>
<text y="5" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#67e8f9">06</text></g>
<text x="56" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="url(#t)" filter="url(#g)">PAC-MAN ARCADE</text>
<text x="58" y="66" font-family="Consolas,monospace" font-size="12.5" fill="#94a3b8">// watch Pac-Man eat my contributions</text>
<rect x="56" y="74" width="820" height="2" fill="url(#l)"/>
<rect x="56" y="73" width="120" height="4" fill="url(#beam)"><animate attributeName="x" values="56;760;56" dur="5s" repeatCount="indefinite"/></rect>
</svg>