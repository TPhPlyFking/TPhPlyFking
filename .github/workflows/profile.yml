name: Update cosmic profile

on:
  schedule:
    - cron: "0 */6 * * *"   # tu chay moi 6 tieng
  workflow_dispatch:        # bam tay trong tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  galaxy-and-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Tech Galaxy + latest repos
        run: python scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-galaxy.svg
          git diff --staged --quiet || (git commit -m "🪐 auto-update profile" && git push)

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#0d1117,#2e1065,#5b21b6,#7c3aed,#c4b5fd
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
